<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Test</title>
</head>

<body>
    <header class="header">
        <div class="wrap header__bar">
            <img src="./assets/svg/izza.svg" aria-label="izza" alt="izza brand logo" />
            <nav class="header__nav" aria-label="Main Navigation">
                <a href="#menu" class="header__link">Menu</a>
                <a href="#family" class="header__link">Family</a>
                <a href="#find" class="header__link">Find Us</a>
                <a href="#contact" class="header__link">Contact</a>
            </nav>
            <div id="header__right">
                <a href="#contact" class="header__contact-link">contact<img src="./assets/svg/phone.svg"
                        alt="phone" /></a>

                <button id="menu-btn" class="header__menu-btn" aria-expanded="false" aria-controls="nav">
                    <img src="./assets/svg/menu.svg" alt="menu" />
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <img src="./assets/img/hero.jpg" alt="" class="hero__bg" fetchpriority="high">
            <div class="wrap">
                <h1 class="hero__title">There is always time for pizza...</h1>
            </div>
        </section>

        <section id="menu" class="menu">
            <div class="wrap menu__wrap">
                <h1 class="menu__title">Menu</h1>

                <div class="menu__filters" role="group" aria-label="Filter menu">
                    <button class="menu__filter-btn">Pizza</button>
                    <button class="menu__filter-btn">Calzone</button>
                    <button class="menu__filter-btn">Dessert</button>
                    <button class="menu__filter-btn">Drinks</button>
                </div>
            </div>

        </section>
    </main>
    <script src="./js/all.js"></script>
</body>

</html>
